<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101014"><title>WreckLib</title><link rel="stylesheet" href="./style.css"></head><body><header><div class="brand">◇ <b>WreckLib</b></div><span id="account">Энциклопедия кампаний</span></header><main><div id="notice" role="status"></div><section id="login"><h1>Вход в WreckLib</h1><p class="muted">Войди по ссылке из электронной почты, чтобы открыть свои кампании.</p><form id="login-form"><input name="email" type="email" required placeholder="Электронная почта"><button class="primary">Получить ссылку</button></form></section><button id="logout" hidden>Выйти из аккаунта</button><section id="home" hidden><div class="eyebrow">ВАША БИБЛИОТЕКА</div><h1>Кампании</h1><p class="muted">Каждая кампания — отдельный мир со своими участниками и записями.</p><div id="campaigns" class="cards"></div><form id="campaign-form"><input name="name" required maxlength="100" placeholder="Название кампании"><button class="primary">+ Создать кампанию</button></form></section><section id="inside" hidden><button id="back">← Все кампании</button><div class="eyebrow" id="role"></div><h1 id="campaign-name"></h1><div class="layout"><aside><h3>Разделы</h3><div id="tree"></div><button id="new-folder">+ Папка</button><button id="new-card">+ Карточка</button><div id="invite-panel" hidden><h3>Пригласить</h3><form id="invite-form"><input name="email" type="email" placeholder="Email" required><select name="role"><option value="viewer">Игрок</option><option value="editor">Игрок+</option><option value="master">Мастер</option></select><button>Создать приглашение</button></form><div id="invite-link"></div></div></aside><article><div id="detail"><p class="muted">Выберите запись слева или создайте новую.</p></div></article></div></section></main><dialog id="editor"><form id="entry-form" method="dialog"><h2 id="editor-title">Новая карточка</h2><label>Тип<select name="kind" id="kind"><option value="person">Персонаж</option><option value="location">Локация</option><option value="item">Предмет</option><option value="faction">Фракция</option><option value="event">Событие</option><option value="article">Статья</option><option value="folder">Папка</option></select></label><label>Название<input name="title" required maxlength="140"></label><label>Краткое описание<textarea name="description"></textarea></label><label>Содержание<textarea name="body" rows="7"></textarea></label><div id="gm-fields"><label>Скрытые заметки Мастера<textarea name="secret_body" rows="4"></textarea></label><label><input type="checkbox" name="hidden"> Скрыть всю запись от игроков</label></div><div class="actions"><button type="button" id="cancel">Отмена</button><button class="primary">Сохранить</button></div></form></dialog><script type="module" src="./app.js"></script></body></html>
